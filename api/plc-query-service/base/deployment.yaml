apiVersion: apps/v1
kind: Deployment
metadata:
  name: plc-query-service
  labels:
    app.kubernetes.io/name: plc-query-service
    app.kubernetes.io/part-of: industrial-data-platform-quarkus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plc-query-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plc-query-service
        app.kubernetes.io/part-of: industrial-data-platform-quarkus
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /q/metrics
        prometheus.io/port: "8080"
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: plc-query-service
          image: harbor.lab.harald-hiergeist.de/sharvester/plc-query-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: PLC_READINGS_TOPIC
              value: plc.raw.readings
            - name: KAFKA_CONSUMER_GROUP
              value: plc-query-quarkus-group
            - name: REDIS_URL
              value: redis://redis.redis.svc.cluster.local:6379
            - name: DB_URL
              value: jdbc:postgresql://postgres.cluster.lab:5432/plcdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: industrial-db-secret
                  key: username
                  optional: true
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: industrial-db-secret
                  key: password
                  optional: true
            - name: KEYCLOAK_ISSUER_URI
              value: https://keycloak.cluster.lab/realms/industrial
            - name: OIDC_CLIENT_ID
              value: plc-industrial-ui
            - name: CORS_ORIGINS
              value: https://plc-ui-quarkus.cluster.lab,http://localhost:4200
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
