apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plc-query-service
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - plc-query-quarkus.lab.harald-hiergeist.de
      secretName: plc-query-quarkus-tls
  rules:
    - host: plc-query-quarkus.lab.harald-hiergeist.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plc-query-service
                port:
                  number: 80