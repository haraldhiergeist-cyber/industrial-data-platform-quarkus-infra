apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plc-query-service
spec:
  ingressClassName: traefik
  rules:
    - host: plc-query.lab.harald-hiergeist.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plc-query-service
                port:
                  number: 80
  tls:
    - hosts:
        - plc-query.lab.harald-hiergeist.de
      secretName: cluster-lab-tls