apiVersion: apps/v1
kind: Deployment
metadata:
  name: plc-industrial-ui
  labels:
    app.kubernetes.io/name: plc-industrial-ui
    app.kubernetes.io/part-of: industrial-data-platform-quarkus
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: plc-industrial-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plc-industrial-ui
        app.kubernetes.io/part-of: industrial-data-platform-quarkus
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: plc-industrial-ui
          image: harbor.cluster.lab/industrial-quarkus/plc-industrial-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
